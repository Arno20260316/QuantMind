[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quantmindoss"
version = "0.1.3"
description = "QuantMind OpenAPI SDK: news sentiment, model inference results, paper-trading positions"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [{ name = "QuantMind" }]
keywords = ["quant", "trading", "openapi", "sdk", "sentiment", "backtest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/qusong0627/QuantMind"
Repository = "https://github.com/qusong0627/QuantMind"

[tool.setuptools.packages.find]
where = ["."]
include = ["quantmindoss*"]
